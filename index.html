<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سایت من</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f5f9;
            color: #222;
            text-align: center;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        main {
            max-width: 700px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0001;
        }

        .button {
            display: inline-block;
            background: #1565c0;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            margin-top: 15px;
        }

        footer {
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>به سایت من خوش آمدید</h1>
        <p>اولین سایت من با GitHub Pages</p>
    </header>

    <main>
        <h2>درباره سایت من</h2>

        <p>
            این اولین سایت من است.
            به‌زودی مطالب و امکانات جدیدی به آن اضافه می‌کنم.
        </p>

        <a class="button"
           href="https://github.com/">
            ورود به گیت‌هاب
        </a>
    </main>

    <footer>
        ساخته شده با علاقه ❤️
    </footer>

</body>
</html>
